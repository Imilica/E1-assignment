<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot Password - Sandbox</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav id="nav"></nav>
<main>
  <h1>Forgot password</h1>
  <p class="muted">Enter your email and we'll send you a reset link.</p>
  <div id="message" class="success" role="status" data-testid="forgot-message" hidden></div>
  <form id="forgot-form" novalidate>
    <label for="email">Email</label>
    <input id="email" type="email" placeholder="Email" data-testid="email">
    <div class="error" id="email-error" data-testid="email-error"></div>
    <button type="submit" class="primary" data-testid="forgot-submit">Send reset link</button>
  </form>
  <div class="links"><a href="/login" data-testid="back-to-login">Back to login</a></div>
</main>
<script src="/static/app.js"></script>
<script src="/static/forgot.js"></script>
</body></html>
